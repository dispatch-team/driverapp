name: Build and Upload Flutter APK to Firebase

on:
  push:
    branches:
      - main

jobs:
  build-and-upload:
    name: Build and Upload APK
    runs-on: ubuntu-latest
    env:
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-


      - name: Update version in pubspec.yaml
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          sed -i "s/^version: \([0-9.]*\)+[0-9]*/version: \1+$BUILD_NUMBER/" pubspec.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce 90% line coverage
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 \
            | grep -E "^\s+lines" \
            | grep -oP '[0-9]+\.[0-9]+(?=%)' \
            | head -1)
          echo "Line coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 90" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below the required 90% threshold"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets the 90% requirement"

      - name: Build APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols --dart-define=MAPS_API_KEY=${MAPS_API_KEY}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: build/app/outputs/flutter-apk/app-release.apk
          groups: testers
          releaseNotes: |
            Build from GitHub Actions – Build #${{ github.run_number }}